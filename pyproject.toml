[project]
name = "pancake-mono"
version = "1.0.1"
description = "Maple Mono と Kiwi Maru を合成した日英フォント Pancake Mono / Pancake Sans のビルドスクリプト"
requires-python = ">=3.14"
dependencies = [
    "brotli>=1.2.0",
    "fonttools>=4.66.1",
    "skia-pathops>=0.9.2",
    "ttfautohint-py>=0.6.1",
]

[dependency-groups]
dev = [
    "opentype-sanitizer>=9.2.0",
    "playwright>=1.63.0",
    "uharfbuzz>=0.56.2",
]
